name: Check blueprint contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/schema_tool.py validate examples/dual-stream/visual-schema.json
      - run: python scripts/schema_tool.py validate examples/iterative/visual-schema.json
      - name: Check that compiled examples are current
        run: |
          python scripts/schema_tool.py compile examples/dual-stream/visual-schema.json --output examples/dual-stream/renderer-prompt.md
          python scripts/schema_tool.py compile examples/iterative/visual-schema.json --output examples/iterative/renderer-prompt.md
          git diff --exit-code -- examples
